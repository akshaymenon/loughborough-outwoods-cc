name: Clean sponsor logo assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-sponsor-assets.yml'

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Clean sponsor logos
        run: python .github/scripts/clean_sponsor_logos.py
      - name: Upload cleaned logos
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-sponsor-logos
          path: assets/images/sponsors/cleaned
