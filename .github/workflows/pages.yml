name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for file in assets/*.js; do
            node --check "$file"
          done
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile .github/scripts/*.py
      - name: Prepare sponsor logos
        run: |
          python -m pip install --disable-pip-version-check pillow
          python .github/scripts/clean_sponsor_logos.py
      - name: Keep pre-refresh cricket archive
        run: cp data/cricket/site.json /tmp/site-before.json
      - name: Sync Play-Cricket
        continue-on-error: true
        env:
          PLAY_CRICKET_API_TOKEN: ${{ secrets.PLAY_CRICKET_API_TOKEN }}
          PLAY_CRICKET_SITE_ID: ${{ vars.PLAY_CRICKET_SITE_ID || '7239' }}
        run: python .github/scripts/sync_play_cricket.py
      - name: Preserve historical cricket seasons
        run: python .github/scripts/preserve_cricket_history.py /tmp/site-before.json data/cricket/site.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
