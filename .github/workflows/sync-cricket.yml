name: Refresh Play-Cricket data

on:
  schedule:
    # Weekly on Wednesday throughout the year (05:17 UTC).
    - cron: '17 5 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep pre-refresh archive
        run: cp data/cricket/site.json /tmp/site-before.json
      - name: Fetch cricket data
        env:
          PLAY_CRICKET_API_TOKEN: ${{ secrets.PLAY_CRICKET_API_TOKEN }}
          PLAY_CRICKET_SITE_ID: ${{ vars.PLAY_CRICKET_SITE_ID || '7239' }}
        run: python .github/scripts/sync_play_cricket.py
      - name: Preserve historical seasons
        run: python .github/scripts/preserve_cricket_history.py /tmp/site-before.json data/cricket/site.json
      - name: Save updated data
        run: |
          git config user.name "outwoods-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cricket/site.json
          git diff --cached --quiet || git commit -m "Update Play-Cricket data"
          git push
